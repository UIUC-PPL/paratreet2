# HBT-HERONS configuration with its own defaults for unbinding, for the
# sub-box checks (design/subhalo-checks.md, "cosmo25: HBT-HERONS on a
# sub-box"). The paths are replaced by the job script.

[================================== FILE PATHS ================================]
SnapshotPath      SNAPDIR
HaloPath          SNAPDIR
SnapshotFileBase  snap
SubhaloPath       OUTDIR
MinSnapshotIndex  0
MaxSnapshotIndex  0

[=================================== FILE IO ==================================]
SnapshotFormat   swiftsim
GroupFileFormat  swiftsim_particle_index
ParticlesSplit   0
# hbtref reads the bound particles' energies.
SaveBoundParticleBindingEnergies  1

[==================================== UNITS ===================================]
MassInMsunh   -1
LengthInMpch  -1
VelInKmS      -1

[================================ SIMULATION BOX ==============================]
PeriodicBoundaryOn  1
BoxSize             -1

[=========================== GRAVITATIONAL SOFTENING ==========================]
SofteningHalo             -1
MaxPhysicalSofteningHalo  -1

[================================== UNBINDING =================================]
# HBT-HERONS's defaults (src/config_parser.h, c728ee0), written out.
MaxSampleSizeOfPotentialEstimate  1000
TreeNodeOpenAngle                 0.45
BoundMassPrecision                0.995
MinNumPartOfSub                   20
