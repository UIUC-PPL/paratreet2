# HBT-HERONS configuration for the Mac check on inputs/8m-lambb.tipsy
# (design/subhalo-checks.md, Check 2). The snapshot is written by
# subhalo/tipsy2hbt from the Tipsy file and FoF3's label files, as
# <SnapshotPath>/snap_0000.hdf5. Paths are for the Mac; change them elsewhere.

[================================== FILE PATHS ================================]
SnapshotPath      /Users/ritvik/hbt-test/8m-lambb/snap
HaloPath          /Users/ritvik/hbt-test/8m-lambb/snap
SnapshotFileBase  snap
SubhaloPath       /Users/ritvik/hbt-test/8m-lambb/out
MinSnapshotIndex  0
MaxSnapshotIndex  0

[=================================== FILE IO ==================================]
SnapshotFormat   swiftsim
GroupFileFormat  swiftsim_particle_index
ParticlesSplit   0

[==================================== UNITS ===================================]
# -1: read from the snapshot.
MassInMsunh   -1
LengthInMpch  -1
VelInKmS      -1

[================================ SIMULATION BOX ==============================]
PeriodicBoundaryOn  1
BoxSize             -1

[=========================== GRAVITATIONAL SOFTENING ==========================]
SofteningHalo             -1
MaxPhysicalSofteningHalo  -1
