# HBT-HERONS configuration for the Mac check on inputs/8m-lambb.tipsy
# (design/subhalo-checks.md, Check 2). The snapshot is written by
# subhalo/tipsy2hbt from the Tipsy file and FoF3's label files, as
# <SnapshotPath>/snap_0000.hdf5. Paths are for the Mac; change them elsewhere.
#
# Since 2026-11-11 this sets the three unbinding options below (no source
# sampling, opening angle 0.1, energies saved). The first run of Check 2 used
# this file without them, so with HBT-HERONS's defaults (1,000 sampled
# sources, opening angle 0.45).

[================================== FILE PATHS ================================]
SnapshotPath      /Users/ritvik/hbt-test/8m-lambb/snap
HaloPath          /Users/ritvik/hbt-test/8m-lambb/snap
SnapshotFileBase  snap
SubhaloPath       /Users/ritvik/hbt-test/8m-lambb/out
MinSnapshotIndex  0
MaxSnapshotIndex  0

[=================================== FILE IO ==================================]
SnapshotFormat   swiftsim
GroupFileFormat  swiftsim_particle_index
ParticlesSplit   0
# Write each bound particle's energy (dataset BindingEnergies, in the order
# of SubhaloParticles).
SaveBoundParticleBindingEnergies    1

[==================================== UNITS ===================================]
# -1: read from the snapshot.
MassInMsunh   -1
LengthInMpch  -1
VelInKmS      -1

[================================ SIMULATION BOX ==============================]
PeriodicBoundaryOn  1
BoxSize             -1

[=========================== GRAVITATIONAL SOFTENING ==========================]
SofteningHalo             -1
MaxPhysicalSofteningHalo  -1

[================================== UNBINDING =================================]
# No sampling of the sources (the default uses at most 1,000 per group).
MaxSampleSizeOfPotentialEstimate    0
# Tree opening angle (the default is 0.45).
TreeNodeOpenAngle                   0.1
