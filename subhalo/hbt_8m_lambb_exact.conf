# HBT-HERONS configuration for the exact unbinding reference on
# inputs/8m-lambb.tipsy (design/subhalo-checks.md, "Exact reference for the
# unbinding kernel"). Same snapshot as hbt_8m_lambb.conf. Run it with the
# HBT_REAL8=ON build for the reference (exact-double); the default build with
# another SubhaloPath gives exact-single.

[================================== FILE PATHS ================================]
SnapshotPath      /Users/ritvik/hbt-test/8m-lambb/snap
HaloPath          /Users/ritvik/hbt-test/8m-lambb/snap
SnapshotFileBase  snap
SubhaloPath       /Users/ritvik/hbt-test/8m-lambb/out-exact-double
MinSnapshotIndex  0
MaxSnapshotIndex  0

[=================================== FILE IO ==================================]
SnapshotFormat   swiftsim
GroupFileFormat  swiftsim_particle_index
ParticlesSplit   0
# Write each bound particle's energy (dataset BindingEnergies, in the order
# of SubhaloParticles).
SaveBoundParticleBindingEnergies  1

[==================================== UNITS ===================================]
MassInMsunh   -1
LengthInMpch  -1
VelInKmS      -1

[================================ SIMULATION BOX ==============================]
PeriodicBoundaryOn  1
BoxSize             -1

[=========================== GRAVITATIONAL SOFTENING ==========================]
SofteningHalo             -1
MaxPhysicalSofteningHalo  -1

[================================== UNBINDING =================================]
# No sampling of the sources (this also turns the centre refinement off).
MaxSampleSizeOfPotentialEstimate  0
# Open every tree node: the potential is the plain pairwise sum.
TreeNodeOpenAngle                 0
# Stop only when a pass removes nothing (the default 0.995 stops earlier and
# saves energies from before the last removal).
BoundMassPrecision                1
